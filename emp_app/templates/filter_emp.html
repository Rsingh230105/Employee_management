<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Filter Employee</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous"
</head>
<body>
<div class="container mt-4">
        <h1>Filter An Employee Details</h1>
        <hr>

        <form action="/filter_emp" method="post" class="needs-validation" novalidate>
            {% csrf_token %}

            <div class="form-group">
                <label for="name">Employe First Name/Last Name *</label><br>
                <input type="text" id="name" name="name" value="{{name}}" required>
            </div>

            <div class="form-group">
                <label for="dept">Department</label><br>
                <input type="text"  id="dept" name="dept" value="{{dept}}">
            </div>

            <div class="form-group">
                <label for="role">Role</label><br>
                <input type="text"  id="role" name="role" value="{{role}}">
            </div>


            <hr>
            <button type="submit" class="btn btn-primary">Submit</button>
            <a href="/all_emp" class="btn btn-secondary ml-2">Cancel</a>
        </form>
    </div>
</body>
</html>
