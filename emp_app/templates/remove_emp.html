<!-- emp_app/templates/remove_emp.html -->
{% extends "base.html" %}
{% block title %}Confirm Delete{% endblock %}
{% block content %}
<h1>Confirm Delete</h1>
<p>Are you sure you want to remove <strong>{{ object.first_name }} {{ object.last_name }}</strong>?</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger">Yes, remove</button>
  <a class="btn btn-secondary" href="{% url 'all_emp' %}">Cancel</a>
</form>
{% endblock %}
